name: Publicar na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe (PHP e JS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli >/dev/null
          fail=0
          while IFS= read -r f; do php -l "$f" >/dev/null || fail=1; done < <(find . -name '*.php' -not -path './.git/*')
          for f in assets/*.js sw.js; do node --check "$f" || fail=1; done
          exit $fail

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # passphrase (se a chave tiver) fornecida sem aparecer no log
          printf '#!/bin/sh\necho "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh && chmod 700 ~/.ssh/askpass.sh
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          SSH_ASKPASS=~/.ssh/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm -f ~/.ssh/deploy_key ~/.ssh/askpass.sh

      - name: Publicar arquivos (sem tocar nos dados do servidor)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -T -o LogLevel=ERROR -p ${SSH_PORT:-22} $SSH_USER@$SSH_HOST"
          # teste de conexao
          $SSH "echo CONEXAO_OK; test -d '$DEPLOY_PATH' && echo PASTA_OK" | grep -q PASTA_OK || { echo "Pasta do sistema nao encontrada: verifique DEPLOY_PATH"; exit 1; }
          # 1) codigo: nunca envia data/, configuracoes do servidor nem arquivos de repositorio; nao apaga nada
          tar czf - --exclude=./data --exclude=./db_config.php --exclude=./smtp_config.php \
            --exclude=./.git --exclude=./.github --exclude=./.gitignore . \
            | $SSH "cd '$DEPLOY_PATH' && tar xzf -"
          # 2) cargas iniciais: so adiciona arquivos novos (nunca sobrescreve o que o servidor ja usou)
          tar czf - ./data/carga_inicial ./data/seed.php \
            | $SSH "cd '$DEPLOY_PATH' && mkdir -p data && tar xzkf - 2>/dev/null; true"
          echo "Publicacao concluida"
