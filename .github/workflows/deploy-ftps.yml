name: Publicar na HostGator (FTPS)

# Alternativa ao deploy por SSH, para contas em que o shell está desativado.
# NÃO roda sozinho até você ligar: em GitHub → Settings → Secrets and variables → Actions → Variables,
# crie a variável DEPLOY_FTPS = true e, em Secrets, FTP_HOST, FTP_USER, FTP_PASS e FTP_DIR (pasta do sistema, ex.: /public_html/recebimento).
# Também pode ser disparado à mão na aba Actions (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_FTPS == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe (PHP e JS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli lftp >/dev/null
          fail=0
          while IFS= read -r f; do php -l "$f" >/dev/null || fail=1; done < <(find . -name '*.php' -not -path './.git/*')
          for f in assets/*.js sw.js; do node --check "$f" || fail=1; done
          exit $fail

      - name: Publicar por FTPS (nunca envia data/ nem configurações do servidor; nunca apaga nada)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          test -n "$FTP_HOST" -a -n "$FTP_USER" -a -n "$FTP_PASS" -a -n "$FTP_DIR" || { echo "Faltam os secrets FTP_HOST, FTP_USER, FTP_PASS e FTP_DIR"; exit 1; }
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose=1 --parallel=4 \
            --exclude-glob data/ --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
            --exclude-glob db_config.php --exclude-glob smtp_config.php \
            . "$FTP_DIR"
          mkdir -p "$FTP_DIR/data"
          mirror -R --only-missing --verbose=1 ./data/carga_inicial "$FTP_DIR/data/carga_inicial"
          bye
          LFTP
          echo "Publicação concluída"
