<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Rota do Motorista · Drilling</title>
<link rel="icon" href="/favicon.ico?v=3131">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=3131">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1424;color:#e6eefa;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#0b1424 80%,#0b142400);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:15px}.brand small{display:block;font-size:11px;color:#8ea6c6}
.brand .sair{margin-left:auto;background:none;border:1px solid #2a3d58;color:#9fb6d6;border-radius:9px;padding:6px 10px;font-size:12px}
.prog{margin-top:12px;background:#132139;border:1px solid #22344f;border-radius:14px;padding:12px}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:#9fb6d6}.prog-l b{color:#e6eefa;font-size:15px}
.bar{height:8px;border-radius:9px;background:#1d2e48;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1fbf96,#4ade80);transition:width .4s}
.gps{display:flex;align-items:center;gap:10px;margin-top:10px;background:#101d32;border:1px solid #22344f;border-radius:14px;padding:10px 12px}
.gps span{flex:1;font-size:12px;color:#9fb6d6}.gps span b{display:block;color:#e6eefa;font-size:13px}
.sw{width:50px;height:30px;border-radius:99px;background:#2a3b55;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#1fbf96}.sw.on::after{left:23px}
main{padding:4px 16px}
.card{background:#111e33;border:1px solid #23375a;border-radius:18px;padding:14px;margin-bottom:12px}
.card.prox{border-color:#4b86f0;box-shadow:0 0 0 1px #4b86f0 inset,0 10px 30px #0006}
.card.feito{opacity:.6}
.c-top{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#f5b544;color:#14110a}
.feito .num{background:#34d399}.card.feito .acoes{opacity:1}
.c-top h2{font-size:16px;margin:2px 0 3px;line-height:1.25}.c-top p{margin:0;font-size:12px;color:#9fb6d6}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;margin-top:6px;background:#1c2d47;color:#b7cae4}
.tag.urg{background:#3a141b;color:#ff9aa3}.tag.ok{background:#123629;color:#6ee7b7}
.itens{margin:12px 0 0;padding:10px 12px;background:#0c182b;border-radius:12px;font-size:13px;list-style:none}
.itens li{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed #1f3150}.itens li:last-child{border:0}
.itens b{min-width:64px;color:#8fc0ff;font-weight:700}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:13px;border:1px solid #2b4366;background:#16263f;color:#e6eefa;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.btn.ok{grid-column:1/-1;background:linear-gradient(110deg,#17b48c,#22c39b);border-color:#29d1a6;color:#04261c;font-size:16px;min-height:54px}
.btn.nao{color:#ffb0b7}
.vazio{text-align:center;padding:60px 20px;color:#9fb6d6}.vazio b{display:block;color:#e6eefa;font-size:17px;margin-bottom:6px}.vazio div{font-size:40px;margin-bottom:10px}
.login{max-width:380px;margin:40px auto;padding:0 16px}.login .card{padding:20px}
.login label{display:block;font-size:12px;color:#9fb6d6;margin:12px 0 5px}
.login input,.sheet input,.sheet select,.sheet textarea{width:100%;background:#0b1527;border:1px solid #2a3d58;border-radius:11px;color:#e6eefa;padding:12px;font-size:16px}
.erro{color:#ff9aa3;font-size:13px;min-height:18px;margin-top:10px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sheet{background:#111e33;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px}.sheet p{margin:0 0 12px;font-size:13px;color:#9fb6d6}
.sheet label{display:block;font-size:12px;color:#9fb6d6;margin:12px 0 5px}
.motivos{display:grid;gap:7px}.motivos button{text-align:left;padding:13px;border-radius:12px;border:1px solid #2a3d58;background:#0e1a2e;color:#e6eefa;font-size:14px}
.motivos button.on{border-color:#f87171;background:#2a1219}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#1b2b45;border:1px solid #2f4870;border-radius:13px;padding:13px;font-size:14px;z-index:30;text-align:center}
.toast.err{background:#3a141b;border-color:#7a2b37}
.fim{font-size:12px;color:#7d93b3;text-align:center;margin:14px 0}

.pend{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;margin-top:6px;background:#3d3011;color:#f5c96a}
.net{margin:8px 16px 0;padding:10px 12px;border-radius:12px;background:#3d3011;color:#f5c96a;font-size:13px}
.inst{margin:8px 16px 0;padding:10px 12px;border-radius:12px;background:#10243f;border:1px solid #2b4366;font-size:13px;color:#bcd0ea;display:flex;gap:10px;align-items:center}.inst button{margin-left:auto;background:#1b3a63;color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:700}
.btn.esp{grid-column:1/-1;background:#12233b;border-color:#3a5f94;color:#bcd9ff}
.rotaacoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px 0}.rotaacoes .btn{min-height:46px;font-size:13px}.rotaacoes .btn.larga{grid-column:1/-1}
.btn.esp2{background:#12233b;border-color:#3a5f94;color:#bcd9ff}
.full{position:fixed;inset:0;z-index:25;background:#0b1424;overflow:auto;padding:0 0 calc(30px + env(safe-area-inset-bottom))}
.full .bar2{position:sticky;top:0;background:#0b1424ee;backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #22344f}
.full .bar2 b{flex:1;font-size:16px}.full .bar2 button{background:#1b2b45;color:#e6eefa;border:1px solid #2f4870;border-radius:10px;padding:9px 13px;font-weight:700}
.sec{margin:12px 14px;background:#111e33;border:1px solid #23375a;border-radius:16px;padding:12px 14px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;color:#8ea6c6;text-transform:uppercase}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}.kv span{color:#8ea6c6;font-size:12px;padding-top:2px}.kv div{word-break:break-word}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:left;font-size:10px;color:#8ea6c6;text-transform:uppercase;padding:4px 4px}.tb td{padding:7px 4px;border-top:1px solid #1f3150;vertical-align:top}.tb td.q{white-space:nowrap;font-weight:800;color:#8fc0ff;text-align:right}.tb small{color:#7d93b3;display:block}
.obsx{white-space:pre-wrap;font-size:13px;line-height:1.5;color:#d4e1f4}
.pdfbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 14px;min-height:50px;border-radius:13px;background:#1b3a63;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div id="app"><div class="vazio"><div>⏳</div>Carregando…</div></div>
<script>
'use strict';
const K = { tok: 'rd_mot_token', dev: 'rd_mot_dev', fila: 'rd_mot_fila', cache: 'rd_mot_cache', gps: 'rd_mot_gps' };
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { tok: '', dev: '', d: null, fila: [], gps: false, watch: null, ultimoEnvio: 0, offline: false, enviando: false, instalar: null };
const $ = id => document.getElementById(id);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qtd = v => { const n = Number(String(v).replace(',', '.')); return isNaN(n) ? h(v) : n.toLocaleString('pt-BR', { maximumFractionDigits: 3 }); };
const hora = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
const dataBr = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '';
const rnd = n => { const a = new Uint8Array(n); (crypto || window.msCrypto).getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join('').slice(0, n); };
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }

async function api(a, body) {
  const init = { cache: 'no-store', headers: { 'X-MOT-TOKEN': S.tok, 'X-MOT-DEV': S.dev, 'Content-Type': 'application/json' } };
  if (body) { init.method = 'POST'; init.body = JSON.stringify(body); }
  let r; try { r = await fetch('motorista_api.php?a=' + a, init); } catch (e) { const x = new Error('Sem conexão'); x.rede = true; throw x; }
  let d; try { d = await r.json(); } catch { const x = new Error('Servidor indisponível'); x.rede = true; throw x; }
  if (!r.ok || !d.ok) { const e = new Error(d.error || 'Erro ' + r.status); e.status = r.status; e.codigo = d.codigo; throw e; }
  return d;
}

/* ---------- inicialização ---------- */
function iniciar() {
  const u = new URLSearchParams(location.search).get('t');
  if (u && /^[a-f0-9]{48}$/.test(u)) ls.set(K.tok, u);
  S.tok = ls.get(K.tok) || '';
  S.dev = ls.get(K.dev) || ''; if (!S.dev) { S.dev = rnd(32); ls.set(K.dev, S.dev); }
  try { S.fila = JSON.parse(ls.get(K.fila) || '[]'); } catch (e) { S.fila = []; }
  if (!S.tok) return telaMsg('🔗', 'Abra o link do escritório', 'Este app só abre com o link pessoal que o escritório enviou pelo WhatsApp. Toque nele de novo para entrar.');
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'motorista_manifest.php?t=' + S.tok; document.head.appendChild(m);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/motorista_sw.js', { scope: '/motorista.html' }).catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.instalar = e; if (S.d) render(); });
  window.addEventListener('online', () => { S.offline = false; enviarFila().then(() => carregar(true)); });
  window.addEventListener('offline', () => { S.offline = true; if (S.d) render(); });
  try { S.d = JSON.parse(ls.get(K.cache) || 'null'); } catch (e) { S.d = null; }
  if (S.d) render();
  carregar().then(() => { enviarFila(); if (ls.get(K.gps) === '1' && S.d && S.d.rota) alternarGps(true); });
  setInterval(() => { if (!document.hidden) { enviarFila().then(() => carregar(true)); } }, 45000);
}
function telaMsg(ic, t, p) { $('app').innerHTML = `<div class="vazio"><div>${ic}</div><b>${h(t)}</b>${h(p)}</div>`; }

async function carregar(silencioso) {
  try {
    const d = await api('rota'); S.d = d; S.offline = false; ls.set(K.cache, JSON.stringify(d)); render();
  } catch (e) {
    if (e.rede) { S.offline = true; if (S.d) render(); else telaMsg('📡', 'Sem conexão', 'Conecte-se à internet para carregar a rota pela primeira vez.'); return; }
    if (e.codigo === 'link') { ls.del(K.cache); return telaMsg('🔒', 'Link inválido ou vencido', 'Peça um novo link ao escritório e abra-o neste celular.'); }
    if (e.codigo === 'aparelhos') return telaMsg('📵', 'Link em uso em outros aparelhos', e.message);
    if (!silencioso) toast(e.message, true);
  }
}

/* ---------- fila de envio (funciona sem sinal) ---------- */
function salvarFila() { ls.set(K.fila, JSON.stringify(S.fila)); }
async function enviarFila() {
  if (S.enviando || !S.fila.length) return; S.enviando = true; let enviou = false;
  try {
    while (S.fila.length) {
      const op = S.fila[0];
      try { await api(op.tipo === 'coletou' ? 'coletou' : 'nao_coletou', op); S.fila.shift(); salvarFila(); enviou = true; }
      catch (e) {
        if (e.rede) break;                                   // sem sinal: tenta depois
        if (e.status === 401 || e.status === 403 && e.codigo) break;
        S.fila.shift(); salvarFila(); toast(e.message, true);   // recusada pelo servidor (ex.: coleta fora da rota): descarta
      }
    }
  } finally { S.enviando = false; if (enviou) await carregar(true); else render(); }
}
const pendente = id => S.fila.some(o => o.id === id);

/* ---------- GPS ---------- */
function pegarGps() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, precisao: Math.round(p.coords.accuracy || 0) }), () => res(null), { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 });
  });
}
function alternarGps(silencioso) {
  if (S.gps) { if (S.watch != null) navigator.geolocation.clearWatch(S.watch); S.gps = false; S.watch = null; ls.del(K.gps); if (!silencioso) render(); return; }
  if (!navigator.geolocation) return toast('Este celular não oferece localização.', true);
  S.gps = true; ls.set(K.gps, '1'); render();
  S.watch = navigator.geolocation.watchPosition(async pos => {
    if (Date.now() - S.ultimoEnvio < 45000) return; S.ultimoEnvio = Date.now();
    try { await api('posicao', { lat: pos.coords.latitude, lng: pos.coords.longitude, precisao: Math.round(pos.coords.accuracy || 0) }); } catch (e) {}
  }, err => { S.gps = false; render(); toast(err.code === 1 ? 'Permita a localização para este app nas configurações do celular.' : 'Não foi possível obter a localização.', true); }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
}

/* ---------- tela ---------- */
const mapsLink = p => p.tem_coordenadas ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco_completo || p.fornecedor)}`;
const wazeLink = p => p.tem_coordenadas ? `https://waze.com/ul?ll=${p.lat},${p.lng}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent(p.endereco_completo || p.fornecedor)}&navigate=yes`;
const ehIos = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

function paradasView() {
  const r = S.d && S.d.rota; if (!r) return [];
  return r.paradas.map(p => {
    const pend = pendente(p.id); const op = S.fila.find(o => o.id === p.id);
    return { ...p, _pend: pend, concluida: p.concluida || (pend && op.tipo === 'coletou'), nao_coletada: p.nao_coletada || (pend && op.tipo === 'nao') };
  });
}
function render() {
  const d = S.d, r = d && d.rota, ps = paradasView(), feitas = ps.filter(p => p.concluida).length, naoC = ps.filter(p => p.nao_coletada).length;
  const topo = `<div class="top"><div class="brand"><img src="assets/icons/icon-192.png" alt=""><div><b>Rota de coleta</b><small>${h(d ? (d.motorista || '') + (r ? ' · ' + dataBr(r.criada_em) : '') : '')}</small></div><button class="sair" onclick="carregar()">↻ Atualizar</button></div>
    ${r ? `<div class="prog"><div class="prog-l"><span><b>${feitas} de ${ps.length}</b> coletas feitas${naoC ? ' · ' + naoC + ' não coletada(s)' : ''}</span><span>~${String(r.km_estimado).replace('.', ',')} km</span></div><div class="bar"><i style="width:${ps.length ? Math.round(feitas / ps.length * 100) : 0}%"></i></div></div>
    <div class="gps"><span><b>Compartilhar minha localização</b>${S.gps ? 'Ligado — o escritório vê o caminhão no mapa' : 'Desligado (a localização exata é gravada em cada coleta)'}</span><button class="sw ${S.gps ? 'on' : ''}" aria-label="Compartilhar localização" onclick="alternarGps()"></button></div>` : ''}</div>`;
  const avisos = (S.offline ? `<div class="net">📡 Sem sinal. O que você registrar fica salvo no celular e é enviado sozinho quando a conexão voltar.</div>` : '')
    + (S.fila.length ? `<div class="net">⏳ ${S.fila.length} registro(s) aguardando envio.</div>` : '')
    + (!standalone && S.instalar ? `<div class="inst"><span>Instale o app para abrir direto na rota.</span><button onclick="instalar()">📲 Instalar</button></div>` : '')
    + (!standalone && ehIos ? `<div class="inst"><span>No iPhone: toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>.</span></div>` : '');
  if (!r) { $('app').innerHTML = topo + avisos + `<main><div class="vazio"><div>🚚</div><b>Nenhuma rota em andamento</b>Quando o escritório iniciar a rota, as paradas aparecem aqui.<br><br><button class="btn" style="margin:auto;padding:0 22px" onclick="carregar()">↻ Atualizar</button></div></main>`; return; }
  const prox = ps.findIndex(p => !p.concluida && !p.nao_coletada);
  const pendentes = ps.filter(p => !p.concluida && !p.nao_coletada);
  const acoesRota = pendentes.length ? `<div class="rotaacoes"><a class="btn esp2 larga" href="${rotaCompletaLink(pendentes, r.origem)}" target="_blank" rel="noopener">🧭 Abrir a rota completa no Maps (${Math.min(pendentes.length, 9)} parada${pendentes.length > 1 ? 's' : ''} + volta)</a>
    <button class="btn esp2 larga" onclick="reotimizar()" ${S.offline ? 'disabled' : ''}>🔀 Refazer a ordem a partir de onde estou</button></div>` : '';
  $('app').innerHTML = topo + avisos + acoesRota + '<main>' + ps.map((p, i) => `<article class="card ${p.concluida || p.nao_coletada ? 'feito' : ''} ${i === prox ? 'prox' : ''}">
      <div class="c-top"><span class="num" ${p.nao_coletada ? 'style="background:#f87171"' : ''}>${p.concluida ? '✓' : p.nao_coletada ? '✕' : i + 1}</span><div style="flex:1;min-width:0"><h2>${h(p.fornecedor || 'Fornecedor')}</h2><p>${h(p.endereco_completo || 'Endereço não cadastrado')}</p>
        ${p.pc ? `<span class="tag">PC ${h(p.pc)}</span> ` : ''}${p.prioridade === 'URGENTE' || (p.pedido && p.pedido.urgente) ? '<span class="tag urg">URGENTE</span> ' : ''}${p.concluida && !p._pend ? `<span class="tag ok">Coletado${p.coletado_em ? ' às ' + hora(p.coletado_em) : ''}</span>` : ''}${p.nao_coletada && !p._pend ? `<span class="tag urg">Não coletado${p.nao_coletada_motivo ? ' — ' + h(p.nao_coletada_motivo) : ''}</span>` : ''}${p._pend ? '<span class="pend">⏳ aguardando envio</span>' : ''}</div></div>
      ${p.pedido && p.pedido.itens.length ? `<ul class="itens">${p.pedido.itens.slice(0, 6).map(x => `<li><b>${qtd(x.quantidade)} ${h(x.unidade)}</b><span>${h(x.descricao)}</span></li>`).join('')}${p.pedido.itens.length > 6 ? `<li><span>… e mais ${p.pedido.itens.length - 6} item(ns) — veja o espelho do pedido</span></li>` : ''}</ul>` : (p.observacao ? `<ul class="itens"><li><span>${h(p.observacao).replace(/\n/g, '<br>')}</span></li></ul>` : '')}
      <div class="acoes">${p.pedido ? `<button class="btn esp" onclick="espelho('${h(p.id)}')">📄 Pedido de compra completo (todos os itens)</button>` : ''}${p.pedido && p.pedido.tem_pdf ? `<a class="btn esp" target="_blank" rel="noopener" href="motorista_api.php?a=pdf&pc=${encodeURIComponent(p.pedido.pc)}&t=${encodeURIComponent(S.tok)}&d=${encodeURIComponent(S.dev)}">📎 PDF original do pedido</a>` : ''}
        ${p.concluida || p.nao_coletada && !p._pend ? '' : `<a class="btn" href="${mapsLink(p)}" target="_blank" rel="noopener">🗺 Maps</a><a class="btn" href="${wazeLink(p)}" target="_blank" rel="noopener">◈ Waze</a>
        ${p.contato ? `<a class="btn" href="tel:${h(String(p.contato).replace(/[^\d+]/g, ''))}">☎ Ligar</a>` : ''}<button class="btn nao" onclick="naoColetou('${h(p.id)}')" ${p.contato ? '' : 'style="grid-column:1/-1"'}>✕ Não coletei</button>
        <button class="btn ok" onclick="coletou('${h(p.id)}')">✓ Coletei</button>`}</div></article>`).join('') + `<p class="fim">Volta: ${h(r.origem ? r.origem.nome : 'depósito')}</p></main>`;
}
/* Rota completa: o Google Maps aceita até 9 paradas intermediárias; vai na ordem da rota e termina no depósito. */
function rotaCompletaLink(pend, origem) {
  const pt = p => p.tem_coordenadas ? p.lat + ',' + p.lng : encodeURIComponent(p.endereco_completo || p.fornecedor);
  const lote = pend.slice(0, 9);
  const dest = origem && origem.lat != null ? origem.lat + ',' + origem.lng : pt(lote[lote.length - 1]);
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest + '&waypoints=' + lote.map(pt).join('%7C');
}
function posicaoAtual() {
  return new Promise((ok, falha) => {
    if (!navigator.geolocation) return falha(new Error('Este aparelho não informa a localização.'));
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), e => falha(new Error(e.code === 1 ? 'Permita a localização para este app nas configurações do celular.' : 'Não foi possível obter a localização.')), { enableHighAccuracy: true, timeout: 20000, maximumAge: 20000 });
  });
}
async function reotimizar() {
  if (S.offline) return toast('Sem sinal: tente de novo quando a conexão voltar.', true);
  if (!confirm('Refazer a ordem das paradas que faltam, a partir de onde você está agora?')) return;
  try {
    toast('Buscando sua localização…');
    const c = await posicaoAtual();
    const r = await api('reotimizar', { lat: c.latitude, lng: c.longitude });
    await carregar();
    toast(r.reordenada ? 'Ordem atualizada: siga a nova sequência.' : (r.motivo || 'A ordem já era a melhor.'));
  } catch (e) { toast(e.message || 'Não foi possível refazer a rota.', true); }
}
function instalar() { if (S.instalar) { S.instalar.prompt(); S.instalar.userChoice.finally(() => { S.instalar = null; render(); }); } }

/* ---------- espelho do pedido de compra ---------- */
function espelho(id) {
  const p = S.d.rota.paradas.find(x => x.id === id); if (!p || !p.pedido) return; const o = p.pedido;
  const kv = (k, v) => v ? `<span>${k}</span><div>${h(v)}</div>` : '';
  const b = document.createElement('div'); b.className = 'full';
  b.innerHTML = `<div class="bar2"><b>PC ${h(o.pc)}</b><button onclick="this.closest('.full').remove()">✕ Fechar</button></div>
    ${o.urgente ? `<div class="sec" style="border-color:#7a2b37;background:#2a1219"><b style="color:#ff9aa3">URGENTE</b>${o.urgente_motivo ? ' — ' + h(o.urgente_motivo) : ''}</div>` : ''}
    <div class="sec"><h4>Pedido de compra</h4><div class="kv">${kv('Número', 'PC ' + o.pc)}${kv('Situação', o.situacao)}${kv('Solicitante', o.solicitante)}${kv('Destino / obra', o.destino)}${kv('Finalidade', o.finalidade)}${kv('OS', o.os)}${kv('Equipamento', o.equipamento)}${kv('Importado em', o.importado_em ? dataBr(o.importado_em) : '')}</div></div>
    <div class="sec"><h4>Fornecedor — onde coletar</h4><div class="kv">${kv('Fornecedor', p.fornecedor)}${kv('CNPJ', p.cnpj)}${kv('Endereço', p.endereco_completo)}${kv('Contato', p.contato)}${kv('Agendada', p.agendada_data ? dataBr(p.agendada_data + 'T12:00:00') + (p.agendada_hora ? ' às ' + p.agendada_hora : '') : '')}${kv('Observação', p.observacao)}</div></div>
    <div class="sec"><h4>Itens do pedido (${o.itens.length})</h4>${o.itens.length ? `<table class="tb"><thead><tr><th>Material</th><th style="text-align:right">Qtd.</th></tr></thead><tbody>${o.itens.map(x => `<tr><td>${h(x.descricao)}<small>${x.sku ? 'SKU ' + h(x.sku) : ''}</small></td><td class="q">${qtd(x.quantidade)} ${h(x.unidade)}</td></tr>`).join('')}</tbody></table>` : `<div class="obsx">${h(o.material) || 'Itens não detalhados no sistema.'}</div>`}</div>
    ${o.observacoes ? `<div class="sec"><h4>Observações do pedido</h4><div class="obsx">${h(o.observacoes)}</div></div>` : ''}${o.obs ? `<div class="sec"><h4>Observações internas</h4><div class="obsx">${h(o.obs)}</div></div>` : ''}
    ${o.tem_pdf ? `<a class="pdfbtn" target="_blank" rel="noopener" href="motorista_api.php?a=pdf&pc=${encodeURIComponent(o.pc)}&t=${encodeURIComponent(S.tok)}&d=${encodeURIComponent(S.dev)}">📎 Abrir o PDF original do pedido</a>` : ''}`;
  document.body.appendChild(b);
}

/* ---------- ações ---------- */
function sheet(html) { const b = document.createElement('div'); b.className = 'sheet-bg'; b.innerHTML = `<div class="sheet">${html}</div>`; b.onclick = e => { if (e.target === b) b.remove(); }; document.body.appendChild(b); return b; }
function enfileirar(op) { S.fila.push(op); salvarFila(); render(); enviarFila(); }
function coletou(id) {
  const p = S.d.rota.paradas.find(x => x.id === id);
  const b = sheet(`<h3>Confirmar coleta</h3><p>${h(p.fornecedor)}${p.pc ? ' · PC ' + h(p.pc) : ''}<br>O horário e a sua localização serão gravados agora.</p>
    <label>Km rodado até aqui (opcional)</label><input id="skm" inputmode="decimal" placeholder="Ex.: 18,5">
    <div class="acoes"><button class="btn" onclick="this.closest('.sheet-bg').remove()">Voltar</button><button class="btn ok" style="grid-column:auto" id="sok">✓ Coletado</button></div>`);
  b.querySelector('#sok').onclick = async () => {
    const bt = b.querySelector('#sok'); bt.disabled = true; bt.textContent = 'Obtendo localização…';
    const g = await pegarGps(), em = new Date().toISOString(), km = b.querySelector('#skm').value.trim() || null; b.remove();
    if (!g) toast('Sem localização (permita o GPS). Coleta registrada só com o horário.', true);
    enfileirar({ op: rnd(24), tipo: 'coletou', id, km_real: km, em_cliente: em, ...(g || {}) }); toast('Coleta registrada ✓');
  };
}
function naoColetou(id) {
  const p = S.d.rota.paradas.find(x => x.id === id); let motivo = '';
  const b = sheet(`<h3>Não foi possível coletar</h3><p>${h(p.fornecedor)}</p><div class="motivos">${Object.entries(S.d.motivos || {}).map(([k, v]) => `<button type="button" data-m="${h(k)}">${h(v)}</button>`).join('')}</div>
    <label>Observação</label><textarea id="sobs" rows="2" placeholder="O que aconteceu?"></textarea>
    <div class="acoes"><button class="btn" onclick="this.closest('.sheet-bg').remove()">Voltar</button><button class="btn nao" id="sok">Registrar</button></div>`);
  b.querySelectorAll('[data-m]').forEach(x => x.onclick = () => { motivo = x.dataset.m; b.querySelectorAll('[data-m]').forEach(y => y.classList.toggle('on', y === x)); });
  b.querySelector('#sok').onclick = async () => {
    if (!motivo) return toast('Escolha o motivo', true);
    const bt = b.querySelector('#sok'); bt.disabled = true; bt.textContent = 'Obtendo localização…';
    const g = await pegarGps(), em = new Date().toISOString(), obs = b.querySelector('#sobs').value; b.remove();
    enfileirar({ op: rnd(24), tipo: 'nao', id, motivo, observacao: obs, em_cliente: em, ...(g || {}) }); toast('Ocorrência registrada. O escritório vai reagendar.');
  };
}
iniciar();
</script>
